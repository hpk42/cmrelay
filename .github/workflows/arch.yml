name: per architecture

# CI's build, deploy and distros jobs for one architecture, so that the deploy and distros
# jobs wait for their own architecture's build only
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # native runners: no cross-building
  build:
    name: nix build
    runs-on: ${{ inputs.arch == 'aarch64' && (vars.LINUX_RUNNER_ARM || 'ubuntu-24.04-arm') || vars.LINUX_RUNNER_LARGE || 'ubuntu-latest' }}
    permissions:
      contents: read
      # cache-nix-action drops superseded caches through the Actions API.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          # keep the build-time inputs through the pre-save garbage collection
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            ${{ vars.NIX_CACHE && format('extra-substituters = {0}', vars.NIX_CACHE) || '' }}
            ${{ vars.NIX_CACHE && format('extra-trusted-public-keys = {0}', vars.NIX_CACHE_KEY) || '' }}
            ${{ vars.NIX_CACHE && 'connect-timeout = 5' || '' }}

      # The key covers the inputs of the expensive builds; with bb33's nix cache, unneeded.
      - uses: nix-community/cache-nix-action@v7
        if: ${{ !vars.NIX_CACHE }}
        with:
          primary-key: nix-${{ runner.os }}-${{ inputs.arch }}-${{ hashFiles('installer/flake.lock', '**/*.nix', 'host/cmrelay/stack/pins.json') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ inputs.arch }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ inputs.arch }}-
          purge-created: 0
          purge-primary-key: never

      # Retried: one cut-short download of a fixed-output derivation took a build down.
      - name: Build the closure and the single file
        run: |
          for attempt in 1 2 3; do
            # 1_build-installer without its tests, which the checks job runs
            if nix build -o build/installer --print-build-logs ./installer#payload; then
              exit 0
            fi
            echo "::warning::nix build attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      # the suite again, on the interpreter and packages the closure ships
      - name: Run the tests on the shipped Python
        run: nix flake check --print-build-logs ./installer

      # build/installer is a symlink into the store; the name carries the commit
      - name: Name the payload after the commit
        run: |
          cp build/installer/bin/cmrelay-*.run "cmrelay-${GITHUB_SHA:0:7}-${{ inputs.arch }}-linux.run"
          ls -lh cmrelay-*.run

      # version 99.0.0 with a deploy that fails, for the deploy job's failing upgrade
      - name: Build a failing release
        run: cp "$(installer/scripts/failing-release)" failing.run

      - uses: actions/upload-artifact@v7
        with:
          name: cmrelay-payload-${{ inputs.arch }}
          path: cmrelay-*.run
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: cmrelay-failing-${{ inputs.arch }}
          path: failing.run
          if-no-files-found: error
          retention-days: 14

  # The built installer in incus containers: install, deliver mail, upgrade, uninstall
  # and reinstall on two relays; take-over and hand-back of a cmdeploy relay, in parallel.
  deploy:
    name: deploy in containers (${{ matrix.test }})
    needs: build
    runs-on: ${{ inputs.arch == 'aarch64' && (vars.LINUX_RUNNER_ARM || 'ubuntu-24.04-arm') || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        test: [relays, takeover]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cmrelay-payload-${{ inputs.arch }}
          path: artifact

      - uses: actions/download-artifact@v8
        with:
          name: cmrelay-failing-${{ inputs.arch }}
          path: failing

      # as chatmail/cmlxc's own lxc-test.yml sets incus up
      - name: Install Incus (Zabbly)
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo curl -fsSL https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/stable $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/zabbly-incus.list
          sudo apt-get update
          sudo apt-get install -y incus incus-client incus-base

      - name: Initialise Incus
        run: |
          sudo systemctl stop docker.socket docker || true
          sudo iptables -P FORWARD ACCEPT
          sudo incus admin init --auto
          sudo chmod 666 /var/lib/incus/unix.socket
          sudo chown -R "$USER:$USER" ~/.config/incus

      - uses: astral-sh/setup-uv@v9.0.0

      # deploy-cmrelay lives on that chatmail/cmlxc branch until it is released;
      # the repository variable CMLXC_REF picks another ref
      - name: Install cmlxc
        env:
          CMLXC_REF: ${{ vars.CMLXC_REF || 'hpk/deploy-cmrelay-init' }}
        run: |
          uv tool install "git+https://github.com/chatmail/cmlxc@$CMLXC_REF"
          uv --color never tool dir --bin >> "$GITHUB_PATH"

      - name: Deploy and test
        env:
          TEST: ${{ matrix.test }}
        run: |
          mkdir -p build/installer/bin
          cp artifact/cmrelay-*.run build/installer/bin/cmrelay.run
          chmod 755 build/installer/bin/cmrelay.run
          cmlxc init
          if [ "$TEST" = takeover ]; then
            installer/scripts/2_test-takeover
          else
            FAILING_INSTALLER=$PWD/failing/failing.run installer/scripts/2_test-cmlxc --full cmr0 cmr1
          fi

  # needs only incus, no cmlxc
  distros:
    name: install on distros
    needs: build
    runs-on: ${{ inputs.arch == 'aarch64' && (vars.LINUX_RUNNER_ARM || 'ubuntu-24.04-arm') || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cmrelay-payload-${{ inputs.arch }}
          path: artifact

      - name: Install and initialise Incus (Zabbly)
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo curl -fsSL https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/stable $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/zabbly-incus.list
          sudo apt-get update
          sudo apt-get install -y incus incus-client incus-base
          sudo systemctl stop docker.socket docker || true
          sudo iptables -P FORWARD ACCEPT
          sudo incus admin init --auto
          sudo chmod 666 /var/lib/incus/unix.socket
          sudo chown -R "$USER:$USER" ~/.config/incus

      - name: Install, deploy and uninstall on Debian 12, 13 and Ubuntu 24.04, 26.04
        run: |
          mkdir -p build/installer/bin
          cp artifact/cmrelay-*.run build/installer/bin/cmrelay.run
          chmod 755 build/installer/bin/cmrelay.run
          installer/scripts/2_test-distros
