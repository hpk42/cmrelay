name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff, tests and the vendored tree
    runs-on: ubuntu-latest
    env:
      RUFF_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: uvx ruff@$RUFF_VERSION check .

      - name: Ruff format check
        run: uvx ruff@$RUFF_VERSION format --check .

      - name: Install the test dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install --group test

      - name: Run pytest
        run: uv run --no-sync pytest

      - name: Verify the vendored tree
        run: ./scripts/vendor-check

  build:
    name: nix build
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cache-nix-action drops superseded caches through the Actions API.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          # keep-outputs and keep-env-derivations stop the pre-save garbage
          # collection from throwing away the build-time inputs, which are
          # exactly what a later run needs in order not to compile again.
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      # A restored store turns the dovecot compile into an evaluation. The
      # key covers what determines the closure, so a source-only commit hits
      # the cache and saves nothing.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'vendor.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # Retried because the fixed-output derivations fetch from the network
      # on every cold run, and one cut-short download took a whole build
      # down. Nix keeps whatever it already built.
      - name: Build the closure and the single file
        run: |
          for attempt in 1 2 3; do
            if nix build --print-build-logs '.?submodules=1#payload'; then
              exit 0
            fi
            echo "::warning::nix build attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      # Copied out of the store: result/ is a symlink into /nix/store, and the
      # name carries the commit so a downloaded file says which one it is.
      - name: Name the payload after the commit
        run: |
          cp result/bin/cmrelay-*.run "cmrelay-${GITHUB_SHA:0:7}-x86_64-linux.run"
          ls -lh cmrelay-*.run

      - uses: actions/upload-artifact@v7
        with:
          name: cmrelay-payload
          path: cmrelay-*.run
          if-no-files-found: error
          retention-days: 14
