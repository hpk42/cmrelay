name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # release.yml runs all of CI on the tag and signs this run's build
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ruff and tests
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      RUFF_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Ruff lint
        run: uvx "ruff@$RUFF_VERSION" check .

      - name: Ruff format check
        run: uvx "ruff@$RUFF_VERSION" format --check .

      - name: Run pytest
        run: uv run pytest

      - name: Build the manual
        run: make -C doc html

  # Not after the checks: a build takes longest, so it starts at once.
  arch:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/arch.yml
    with:
      arch: ${{ matrix.arch }}
    permissions:
      contents: read
      # cache-nix-action drops superseded caches through the Actions API.
      actions: write
