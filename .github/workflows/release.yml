# Standard chatmail/workflow's PyPI/OIDC release publishing workflow 
#
# Publishes to PyPI via trusted publishing (OIDC) when a v* tag is
# pushed, which scripts/make_new_release.py does. 
# One-time setup per project:
#
#   1. On PyPI, add a trusted publisher: owner and repository of
#      the project, workflow name "release.yml", environment "pypi".
#      For a project not yet on PyPI, create a "pending publisher"
#      at https://pypi.org/manage/account/publishing/ with the same
#      values plus the PyPI project name, which must match `name`
#      in pyproject.toml.
#
#   2. In the GitHub repo, create an (empty) environment named
#      "pypi" under Settings -> Environments.

name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Checks, tests and build via the shared reusable workflow, which
  # uploads the built distributions as a "dist" artifact.
  py-checks:
    uses: chatmail/workflows/.github/workflows/py-checks.yml@main

  # VERSION is what nix/closure.nix writes into manifest.json and what an
  # installed host reports, so a tag that disagrees with it would publish a
  # relay that misidentifies itself and an `upgrade` that compares the wrong
  # numbers.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: VERSION matches the tag
        run: |
          version=$(cat VERSION)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::VERSION says $version but the tag says $tag"
            exit 1
          fi
          echo "releasing $version"

  # The payload is the actual deliverable, and it ships twice: on the GitHub
  # release as a .run an operator can copy across by hand, and inside a
  # per-architecture wheel so that `pip install cmrelay` is the last step
  # needing the network. Release asset names are a contract with
  # src/cmrelay/discovery.py:
  # cmrelay-installer-<version>-<arch>-linux.run and its .sig
  #
  # Each arch builds on its own native runner. There is no cross-building
  # here: the payload is a Nix closure of real binaries for that host.
  payload:
    name: payload (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    # A tag push alone must not be able to mint a signature, so the release
    # key lives in an environment with required reviewers. The trust root is
    # therefore GitHub plus whoever can approve this job; see
    # release-keys/README.md.
    environment: release-signing
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the payload
        run: nix build --print-build-logs '.?submodules=1#payload'

      # nix/payload.nix already names the file from VERSION and the
      # architecture, and the job above has checked VERSION against the tag.
      - name: Take the asset out of the store
        run: |
          version="${GITHUB_REF_NAME#v}"
          run="cmrelay-installer-$version-${{ matrix.arch }}-linux.run"
          cp "result/bin/$run" .
          chmod 644 "$run"
          ls -lh "$run"
          sha256sum "$run" | tee -a "$GITHUB_STEP_SUMMARY"

      # Ed25519 over the whole file, through openssl. The private key is
      # written under umask 077, used once, and removed.
      - name: Sign the installer
        env:
          RELEASE_KEY: ${{ secrets.CMRELAY_RELEASE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          run="cmrelay-installer-$version-${{ matrix.arch }}-linux.run"
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::CMRELAY_RELEASE_KEY is not set, so this release" \
                 "could only be installed with --allow-unsigned"
            exit 1
          fi
          umask 077
          printf '%s' "$RELEASE_KEY" > ci.key
          trap 'rm -f ci.key' EXIT
          python3 scripts/cmrelay-sign sign \
            --key ci.key --public release-keys/ci.pem "$run"
          cat "$run.sig"

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            cmrelay-installer-*.run
            cmrelay-installer-*.run.sig
          fail_on_unmatched_files: true

      # Standard library only, so no environment to set up. The version comes
      # from the tag rather than from git describe, and the script refuses one
      # containing a '-', which pip would read as a build tag.
      # The signature travels inside the wheel too: `cmrelay upgrade` can
      # take a candidate from PyPI, and a wheel with no signature in it is
      # one nothing can verify against the release keys.
      - name: Build the wheel around the payload
        run: |
          version="${GITHUB_REF_NAME#v}"
          run="cmrelay-installer-$version-${{ matrix.arch }}-linux.run"
          python3 scripts/wheel-cmrelay.py \
            --payload "$run" \
            --signature "$run.sig" \
            --arch "${{ matrix.arch }}" \
            --version "$version" \
            --outdir wheelhouse

      - name: Check the tags read back
        run: |
          pip install --quiet wheel
          cp -r wheelhouse tagcheck
          python3 -m wheel tags tagcheck/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # The publish job must stay here in the repo's own workflow: PyPI
  # trusted publishing rejects publishes from reusable workflows.
  # See https://github.com/pypi/warehouse/issues/11096
  publish:
    needs: [version, py-checks, payload]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # Only the per-architecture wheels, each carrying its own payload.
      # Deliberately not the sdist or the pure-python wheel that py-checks
      # builds: both would install a cmrelay with no relay in it, which could
      # only go and fetch one. Publishing neither means pip says "no matching
      # distribution" on a platform cmrelay does not support, instead of
      # installing something that fails later.
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Show what is about to be published
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          # Fail loudly instead of skipping silently when the
          # version was already published.
          skip-existing: false
