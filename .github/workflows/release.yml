# A v* tag runs all of CI, signs on bb33 the installers it built for both architectures,
# runs each signed one on its own architecture, and publishes them.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # VERSION is what an installed host reports and what `upgrade` compares.
  version:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: VERSION matches the tag
        run: |
          version=$(cat host/VERSION)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::VERSION says $version but the tag says $tag"
            exit 1
          fi
          echo "releasing $version"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # the build job's cache-nix-action drops superseded caches
      actions: write

  # bb33 hands this job the private release key, which only bb33 holds, and only in a run of
  # this workflow that a v* tag started (bb33's README, Release signing). It runs no action
  # but GitHub's own, so that nothing else in the job sees the key.
  sign:
    needs: ci
    runs-on: bb33-sign
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: cmrelay-payload-*
          path: artifact

      - name: Sign the installers CI built and tested
        run: |
          key=/run/bb33-sign/release.key
          for _ in $(seq 60); do [ -s "$key" ] && break; sleep 1; done
          if [ ! -s "$key" ]; then
            echo "::error::bb33 handed over no release key"
            exit 1
          fi
          mkdir signed
          for arch in x86_64 aarch64; do
            run="signed/cmrelay-installer-${GITHUB_REF_NAME#v}-$arch-linux.run"
            cp artifact/cmrelay-payload-$arch/cmrelay-*.run "$run"
            python3 installer/scripts/3_sign-installer --key "$key" "$run"
          done
          sha256sum signed/* | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: cmrelay-signed
          path: signed/
          if-no-files-found: error
          retention-days: 14

  # native runners with sudo: the signed file is run before it is published
  publish:
    name: publish (${{ matrix.arch }})
    needs: sign
    runs-on: ${{ matrix.arch == 'aarch64' && (vars.LINUX_RUNNER_ARM || 'ubuntu-24.04-arm') || vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: cmrelay-signed
          path: signed

      # unpacks the closure through the header, with the signature line appended
      - name: Run the signed installer and verify its signature
        run: |
          run=$(ls signed/cmrelay-installer-*-${{ matrix.arch }}-linux.run)
          chmod 755 "$run"
          sudo "./$run" --stage-only
          sudo rm -rf /opt/cmrelay
          # the signature line: "cmrelay-sig ", 88 bytes of base64, a newline
          head -c -101 "$run" > unsigned
          tail -c 101 "$run" | sed 's/^cmrelay-sig //' | base64 -d > sig
          openssl pkeyutl -verify -rawin -pubin -inkey release-key.pem -in unsigned -sigfile sig

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: signed/cmrelay-installer-*-${{ matrix.arch }}-linux.run
          fail_on_unmatched_files: true
