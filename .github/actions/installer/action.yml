name: The build job's installer
description: build/installer/bin/cmrelay.run, and failing/failing.run on request
inputs:
  arch: {required: true}
  nix-cache: {default: ""}
  nix-cache-keys: {default: ""}
  failing: {default: "false"}
  payload-sha256: {default: ""}
  failing-sha256: {default: ""}
runs:
  using: composite
  steps:
    - name: Fetch the installers from bb33's artifact store
      id: fetch
      if: inputs.nix-cache && inputs.payload-sha256 && (inputs.failing != 'true' || inputs.failing-sha256)
      continue-on-error: true
      shell: bash
      env:
        STORE: ${{ inputs.nix-cache }}/artifacts
        PAYLOAD: ${{ inputs.payload-sha256 }}
        FAILING: ${{ inputs.failing == 'true' && inputs.failing-sha256 || '' }}
      run: |
        get() {
          curl -fsS --retry 2 --create-dirs -o "$2" "$STORE/$1"
          echo "$1  $2" | sha256sum -c
        }
        get "$PAYLOAD" artifact/cmrelay-bb33.run
        if [ -n "$FAILING" ]; then get "$FAILING" failing/failing.run; fi
    # Failing that, the installer builds from bb33's nix cache, faster than it downloads.
    - uses: cachix/install-nix-action@v31
      if: inputs.nix-cache && steps.fetch.outcome != 'success'
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          extra-substituters = ${{ inputs.nix-cache }}
          extra-trusted-public-keys = ${{ inputs.nix-cache-keys }}
          connect-timeout = 5
    - name: Build the installer from bb33's nix cache
      if: inputs.nix-cache && steps.fetch.outcome != 'success'
      shell: bash
      env:
        FAILING: ${{ inputs.failing }}
      run: |
        nix build -o payload ./installer#payload
        rm -rf artifact failing && mkdir artifact failing && cp payload/bin/cmrelay-*.run artifact/
        [ "$FAILING" != true ] || cp "$(installer/scripts/failing-release)" failing/failing.run
    - uses: actions/download-artifact@v8
      if: ${{ !inputs.nix-cache }}
      with:
        name: cmrelay-payload-${{ inputs.arch }}
        path: artifact
    - uses: actions/download-artifact@v8
      if: ${{ !inputs.nix-cache && inputs.failing == 'true' }}
      with:
        name: cmrelay-failing-${{ inputs.arch }}
        path: failing
    - shell: bash
      run: install -D -m 755 artifact/cmrelay-*.run build/installer/bin/cmrelay.run
