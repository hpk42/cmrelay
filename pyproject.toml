[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmrelay"
description = "Install and maintain a chatmail relay from one file"
requires-python = ">=3.12"
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
# chatmaild comes from the pinned relay submodule, as it does in the closure.
test = [
  "pytest",
  "chatmaild @ file://${PROJECT_ROOT}/cmdeploy-relay/chatmaild",
  "jinja2",
  "markdown",
  "packaging",
  "qrcode",
]
doc = [
  "sphinx",
  "sphinx-autobuild",
  "furo",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["vendor", "cmdeploy-relay"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "F", # Pyflakes
  "I", # isort

  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "PLW", # Pylint Warning
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside a test when the import itself is what is under test.
"tests/*" = ["PLC0415"]
