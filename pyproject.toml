[build-system]
requires = ["setuptools>=68", "setuptools-git-versioning >=2.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "cmrelay"
description = "Single-file installer for a chatmail relay, built as a Nix closure"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
# No dependencies, deliberately. A pip-installed cmrelay reaches four of its
# own modules -- cli, output, version and fetch -- and then execs the payload,
# which brings its own interpreter. jinja2, markdown, qrcode and chatmaild are
# all used on the far side of that handover, by the closure. chatmaild is not
# on PyPI at all; it is relay's own code, built from the vendored commit.
dependencies = []
dynamic = ["version"]

[tool.setuptools-git-versioning]
enabled = true

[project.urls]
Repository = "https://github.com/chatmail/cmrelay"

[project.scripts]
cmrelay = "cmrelay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[dependency-groups]
# chatmaild comes from the pinned relay submodule, which is where every
# other consumer of it gets it too.
test = ["pytest", "chatmaild @ file://${PROJECT_ROOT}/cmdeploy-relay/chatmaild"]

[tool.pytest.ini_options]
addopts = "-v -ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["vendor", "cmdeploy-relay"]
# requires-python is the wheel's floor, not this code's. The wheel only has
# to parse far enough to exec a payload that carries its own 3.14, so it
# declares 3.9 and the four modules on that path defer their annotations.
# Everything else -- vendoring.py reads TOML with tomllib, which is 3.11+ --
# runs inside the closure. Without this, ruff infers 3.9 from the metadata
# and reclassifies stdlib modules as third-party.
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# cli.py must import its verbs lazily: from a pip-installed wheel there is no
# closure and no chatmaild, and the CLI has to reach the code that says so
# rather than fail at import time. fetch.py is the wheel's only real job.
"src/cmrelay/cli.py" = ["PLC0415"]
# verbs.py defers fetch for the same reason, in one place.
"src/cmrelay/verbs.py" = ["PLC0415"]
# Tests import inside a test when the import itself is what is under test.
"tests/*" = ["PLC0415"]

[tool.ruff.lint]
select = [
  "F", # Pyflakes
  "I", # isort

  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "PLW", # Pylint Warning
]
