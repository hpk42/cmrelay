# `uv run pytest` here runs the cmrelay, chatmaild and installer tests.

# chatmail/workflows' make_new_release.py releases cmrelay under this name,
# setting host/VERSION to the new version in the release commit
[tool.make-new-release]
name = "cmrelay"
version-file = "host/VERSION"

[tool.uv]
python-preference = "only-managed"

[tool.uv.workspace]
members = ["host"]

[tool.uv.sources]
cmrelay = { workspace = true }
# the copy in this repository, as in the closure
chatmaild = { path = "host/chatmaild" }

[dependency-groups]
dev = [
    "cmrelay",
    "chatmaild",
    "jinja2",
    "markdown",
    "packaging",
    "pytest",
    "qrcode",
    "pytest-xdist>=3.8.0",
]
doc = ["sphinx", "sphinx-autobuild", "furo", "sphinx-copybutton"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["host/cmrelay", "host/chatmaild/src", "installer"]
